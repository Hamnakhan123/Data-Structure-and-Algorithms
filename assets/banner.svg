<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Data Structures and Algorithms in Java">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0716"/>
      <stop offset="1" stop-color="#160D2E"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="0.5" stop-color="#FF6B1A"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B1A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF6B1A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <!-- background grid -->
  <g stroke="#A78BFA" stroke-opacity="0.08">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M100 0V360M200 0V360M300 0V360M400 0V360M500 0V360M600 0V360M700 0V360M800 0V360M900 0V360M1000 0V360M1100 0V360"/>
  </g>
  <!-- animated binary tree on the right -->
  <g transform="translate(860,70)">
    <circle cx="160" cy="110" r="150" fill="url(#glow)">
      <animate attributeName="r" values="140;160;140" dur="5s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#A78BFA" stroke-width="2.5" stroke-opacity="0.8" fill="none">
      <path d="M160 20 L90 90 M160 20 L230 90 M90 90 L50 170 M90 90 L130 170 M230 90 L190 170 M230 90 L270 170" stroke-dasharray="400">
        <animate attributeName="stroke-dashoffset" from="400" to="0" dur="2.5s" fill="freeze"/>
      </path>
    </g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" text-anchor="middle">
      <g>
        <circle cx="160" cy="20" r="20" fill="#FF6B1A"/><text x="160" y="25" fill="#0A0716">50</text>
        <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/>
      </g>
      <g>
        <circle cx="90" cy="90" r="18" fill="#FCD34D"/><text x="90" y="95" fill="#0A0716">30</text>
        <circle cx="230" cy="90" r="18" fill="#FCD34D"/><text x="230" y="95" fill="#0A0716">70</text>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.57;1" dur="1.4s" fill="freeze"/>
      </g>
      <g>
        <circle cx="50" cy="170" r="16" fill="#A78BFA"/><text x="50" y="175" fill="#0A0716">20</text>
        <circle cx="130" cy="170" r="16" fill="#A78BFA"/><text x="130" y="175" fill="#0A0716">40</text>
        <circle cx="190" cy="170" r="16" fill="#A78BFA"/><text x="190" y="175" fill="#0A0716">60</text>
        <circle cx="270" cy="170" r="16" fill="#F43F5E"/><text x="270" y="175" fill="#F5EEFF">80</text>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.73;1" dur="2.2s" fill="freeze"/>
      </g>
      <!-- search token travelling 50 -> 70 -> 80 -->
      <circle r="7" fill="#F5EEFF" filter="url(#soft)" opacity="0">
        <set attributeName="opacity" to="1" begin="2.4s"/>
        <animateMotion path="M160 20 L230 90 L270 170" dur="3s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <!-- sorting bars at the bottom left -->
  <g transform="translate(70,250)">
    <rect x="0" width="26" y="40" height="40" rx="4" fill="#A78BFA"><animate attributeName="height" values="40;70;40" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="40;10;40" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="34" width="26" y="20" height="60" rx="4" fill="#FF6B1A"><animate attributeName="height" values="60;25;60" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="20;55;20" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="68" width="26" y="50" height="30" rx="4" fill="#FCD34D"><animate attributeName="height" values="30;55;30" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="50;25;50" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="102" width="26" y="5" height="75" rx="4" fill="#F43F5E"><animate attributeName="height" values="75;45;75" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="5;35;5" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="136" width="26" y="35" height="45" rx="4" fill="#A78BFA"><animate attributeName="height" values="45;80;45" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="35;0;35" dur="2.4s" repeatCount="indefinite"/></rect>
    <text x="180" y="72" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#A78BFA">O(n log n)</text>
  </g>
  <!-- titles -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="70" y="78" font-size="18" letter-spacing="6" fill="#FCD34D" font-weight="600">UNIVERSITY COURSE · JAVA 17</text>
    <text x="70" y="140" font-size="52" font-weight="800" fill="#F5EEFF">Data Structures</text>
    <text x="70" y="198" font-size="52" font-weight="800" fill="url(#fire)">&amp; Algorithms in Java</text>
    <text x="70" y="232" font-size="17" fill="#F5EEFF" fill-opacity="0.75">17 modules · runnable code · dry runs · labs · practice tests · capstones</text>
  </g>
  <rect x="70" y="92" width="300" height="4" rx="2" fill="url(#fire)">
    <animate attributeName="width" from="0" to="300" dur="1.8s" fill="freeze"/>
  </rect>
</svg>
